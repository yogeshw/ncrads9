name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt needs a display; every job renders offscreen.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check ncrads9 tests

      - name: black
        run: black --check --diff ncrads9 tests tools

      - name: mypy
        run: mypy ncrads9/core ncrads9/coordinates ncrads9/regions

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: xvfb-run -a python -m pytest --cov=ncrads9 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  parity:
    name: Menu parity snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate the NCRADS9 menu snapshot
        run: xvfb-run -a python tools/dump_menus.py --output docs/parity/ncrads9_menus.txt

      - name: Fail if the snapshot is stale
        run: |
          if ! git diff --quiet -- docs/parity/ncrads9_menus.txt; then
            echo "::error::docs/parity/ncrads9_menus.txt is out of date."
            echo "Run: python tools/dump_menus.py --output docs/parity/ncrads9_menus.txt"
            git --no-pager diff -- docs/parity/ncrads9_menus.txt
            exit 1
          fi

      - name: Report parity against DS9
        run: python tools/menu_diff.py --summary
